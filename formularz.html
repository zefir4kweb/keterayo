<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Formularz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        form {
            max-width: 350px;
            border: 1px solid #ccc;
            padding: 15px;
        }

        .pole {
            margin-bottom: 10px;
        }

        .pole label {
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
            font-size: 14px;
        }

        .pole input[type="text"],
        .pole input[type="password"],
        .pole input[type="date"],
        .pole input[type="tel"],
        .pole input[type="email"],
        .pole textarea {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }

        .nawigacja {
            margin-top: 25px;
            font-size: 15px;
        }

        .nawigacja a {
            color: purple;
        }
    </style>
</head>
<body>

    <h2>Formularz</h2>

    <form action="" method="post">
        
        <div class="pole">
            <label for="imie">Imię:</label>
            <input type="text" id="imie" name="imie" required>
        </div>

        <div class="pole">
            <label for="nazwisko">Nazwisko:</label>
            <input type="text" id="nazwisko" name="nazwisko" required>
        </div>

        <div class="pole">
            <label for="ulica">Ulica:</label>
            <input type="text" id="ulica" name="ulica">
        </div>

        <div class="pole">
            <label for="miasto">Miasto:</label>
            <input type="text" id="miasto" name="miasto">
        </div>

        <div class="pole">
            <label for="haslo">Hasło:</label>
            <input type="password" id="haslo" name="haslo" required>
        </div>

        <div class="pole">
            <label for="data_urodzenia">Data urodzenia:</label>
            <input type="date" id="data_urodzenia" name="data_urodzenia">
        </div>

        <div class="pole">
            <label for="telefon">Telefon:</label>
            <input type="tel" id="telefon" name="telefon">
        </div>

        <div class="pole">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="pole">
            <label for="uwagi">Uwagi:</label>
            <input type="text" id="uwagi" name="uwagi">
        </div>

        <div class="pole">
            Prawo jazdy:<br>
            <input type="radio" name="prawo_jazdy" value="tak" id="pj_tak">
            <label for="pj_tak" style="display:inline; font-weight:normal;">Tak</label>
            <input type="radio" name="prawo_jazdy" value="nie" id="pj_nie" checked>
            <label for="pj_nie" style="display:inline; font-weight:normal;">Nie</label>
        </div>

        <input type="submit" value="Wyślij">
        <input type="reset" value="Wyczyść">

    </form>

    <p class="nawigacja">
        <a href="index.html">Strona główna</a> | 
        <a href="kolumny.html">Kolumny</a> | 
        <a href="kolumny2.html">Kolumny 2</a> | 
        <a href="formularz.html">Formularz</a> | 
        <a href="zdjecia.html">Zdjęcia</a>
    </p>

</body>
</html>
