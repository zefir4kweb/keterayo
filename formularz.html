<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Formularz</title>
</head>
<body>

    <h1>Formularz</h1>

    <form action="" method="post">
        Imię:<br>
        <input type="text" name="imie"><br>
        
        Nazwisko:<br>
        <input type="text" name="nazwisko"><br>
        
        Ulica:<br>
        <input type="text" name="ulica"><br>
        
        Miasto:<br>
        <input type="text" name="miasto"><br>
        
        Hasło:<br>
        <input type="password" name="haslo"><br>
        
        Data urodzenia:<br>
        <input type="date" name="data_urodzenia"><br>
        
        Telefon:<br>
        <input type="text" name="telefon"><br>
        
        Email:<br>
        <input type="text" name="email"><br>
        
        Uwagi:<br>
        <input type="text" name="uwagi"><br>
        
        Prawo jazdy:<br>
        <input type="radio" name="prawo_jazdy" value="tak"> Tak
        <input type="radio" name="prawo_jazdy" value="nie"> Nie<br>
        
        <input type="submit" value="Wyślij">
        <input type="reset" value="Wyczyść"><br><br>
        
        <a href="index.html">Strona główna</a>
    </form>

</body>
</html>
