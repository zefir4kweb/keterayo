<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Kalkulator</h1>

    <table>
        <tr>
            <td colspan="4"><input type="text" id="ekran" readonly></td>
        </tr>
        <tr>
            <td><button onclick="dodaj('7')">7</button></td>
            <td><button onclick="dodaj('8')">8</button></td>
            <td><button onclick="dodaj('9')">9</button></td>
            <td><button onclick="dodaj('/')">/</button></td>
        </tr>
        <tr>
            <td><button onclick="dodaj('4')">4</button></td>
            <td><button onclick="dodaj('5')">5</button></td>
            <td><button onclick="dodaj('6')">6</button></td>
            <td><button onclick="dodaj('*')">*</button></td>
        </tr>
        <tr>
            <td><button onclick="dodaj('1')">1</button></td>
            <td><button onclick="dodaj('2')">2</button></td>
            <td><button onclick="dodaj('3')">3</button></td>
            <td><button onclick="dodaj('-')">-</button></td>
        </tr>
        <tr>
            <td><button onclick="wyczysc()">C</button></td>
            <td><button onclick="dodaj('0')">0</button></td>
            <td><button onclick="dodaj('.')">.</button></td>
            <td><button onclick="dodaj('+')">+</button></td>
        </tr>
        <tr>
            <td colspan="4"><button onclick="oblicz()" class="rowna">=</button></td>
        </tr>
    </table>

    <script src="script.js"></script>
</body>
</html>
